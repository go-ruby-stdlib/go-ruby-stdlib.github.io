baseURL = "https://go-ruby-stdlib.github.io/"
title = "go-ruby-stdlib"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Every module in the pure-Go, CGO-free Ruby standard library. Each entry
# renders one card with its Ruby module, one-line description, and the three
# uniform links (repo / landing / docs) derived from `name`:
#   repo    https://github.com/go-ruby-<name>/<name>
#   landing https://go-ruby-<name>.github.io/
#   docs    https://go-ruby-<name>.github.io/docs/
# `wave` groups the cards (1 = waves 1–2 core, 3, 4).

# ── Waves 1–2 — core (14) ─────────────────────────────────────────────
